AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Floslo API

Globals:
  Function:
    Runtime: provided.al2
    Timeout: 60
    MemorySize: 128
    Architectures:
      - x86_64

Resources:

  #########################################################
  # DYNAMO
  #########################################################

  FlosloTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: floslo
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S

        - AttributeName: SK
          AttributeType: S

        - AttributeName: GSI1PK
          AttributeType: S

        - AttributeName: GSI1SK
          AttributeType: S

      KeySchema:
        - AttributeName: PK
          KeyType: HASH

        - AttributeName: SK
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: GSI1

          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH

            - AttributeName: GSI1SK
              KeyType: RANGE

          Projection:
            ProjectionType: ALL

  #########################################################
  # S3 OBJECTS
  #########################################################

  FlosloBucket:
    Type: AWS::S3::Bucket

    DependsOn:
      - FlosloObjectQueuePolicy

    Properties:
      BucketName: floslo-us-east-1-tenants

      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt FlosloObjectQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .pdf

          - Event: s3:ObjectCreated:*
            Queue: !GetAtt FlosloObjectQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .txt

          - Event: s3:ObjectCreated:*
            Queue: !GetAtt FlosloObjectQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .md

  #########################################################
  # S3 VECTOR BUCKET
  #########################################################

  FlosloVectorBucket:
    Type: AWS::S3Vectors::VectorBucket
    Properties:
      VectorBucketName: floslo-us-east-1-vectors

  #########################################################
  # SQS OBJECT PROCESSING
  #########################################################

  FlosloObjectQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: floslo-object-processing
      VisibilityTimeout: 300
      MessageRetentionPeriod: 1209600

  FlosloObjectQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref FlosloObjectQueue

      PolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              Service: s3.amazonaws.com

            Action:
              - sqs:SendMessage

            Resource: !GetAtt FlosloObjectQueue.Arn

  #########################################################
  # VECTOR INDEX
  #########################################################

  FlosloVectorIndex:
    Type: AWS::S3Vectors::Index

    DependsOn:
      - FlosloVectorBucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      IndexName: floslo-index
      DataType: float32
      Dimension: 1024
      DistanceMetric: cosine
      VectorBucketName: floslo-us-east-1-vectors

  #########################################################
  # API
  #########################################################

  FlosloApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  #########################################################
  # API LAMBDA
  #########################################################

  FlosloFunction:
    Type: AWS::Serverless::Function

    Metadata:
      SkipBuild: True

    Properties:
      CodeUri: cmd/api/build
      Handler: bootstrap
      FunctionName: floslo-api

      Policies:
        - DynamoDBCrudPolicy:
            TableName: floslo

        - S3CrudPolicy:
            BucketName: floslo-us-east-1-tenants

        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/lambda/floslo/*

            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0

            - Effect: Allow
              Action:
                - s3vectors:QueryVectors
              Resource: "*"

      Environment:
        Variables:
          DYNAMO_TABLE: floslo
          BUCKET_NAME: floslo-us-east-1-tenants
          PARAMETER_JWT_SECRET: "/lambda/floslo/jwt_secret"
          VECTOR_BUCKET_NAME: floslo-us-east-1-vectors
          VECTOR_INDEX_NAME: floslo-index
          EMBEDDING_MODEL_ID: amazon.titan-embed-text-v2:0
          GENERATE_MODEL_ID: amazon.nova-lite-v1:0

      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref FlosloApi
            Path: /api/{proxy+}
            Method: ANY

  #########################################################
  # RAG LAMBDA
  #########################################################

  FlosloRAGFunction:
    Type: AWS::Serverless::Function

    Metadata:
      SkipBuild: True

    Properties:
      CodeUri: cmd/rag/build
      Handler: bootstrap
      FunctionName: floslo-rag

      Policies:
        - DynamoDBCrudPolicy:
            TableName: floslo

        - S3CrudPolicy:
            BucketName: floslo-us-east-1-tenants

        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/lambda/floslo/*

            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0

            - Effect: Allow
              Action:
                - s3vectors:QueryVectors
                - s3vectors:GetVectors
              Resource: "*"

      Environment:
        Variables:
          DYNAMO_TABLE: floslo
          BUCKET_NAME: floslo-us-east-1-tenants
          PARAMETER_JWT_SECRET: "/lambda/floslo/jwt_secret"
          VECTOR_BUCKET_NAME: floslo-us-east-1-vectors
          VECTOR_INDEX_NAME: floslo-index
          EMBEDDING_MODEL_ID: amazon.titan-embed-text-v2:0
          GENERATE_MODEL_ID: amazon.nova-lite-v1:0

      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref FlosloApi
            Path: /rag/{proxy+}
            Method: ANY

  #########################################################
  # OBJECT PROCESSOR
  #########################################################

  FlosloObjectProcessorFunction:
    Type: AWS::Serverless::Function

    Properties:
      Runtime: python3.13
      CodeUri: processor/
      Handler: main.lambda_handler
      FunctionName: floslo-object-processor
      Timeout: 300
      MemorySize: 1024

      Policies:
        - DynamoDBCrudPolicy:
            TableName: floslo

        - S3CrudPolicy:
            BucketName: floslo-us-east-1-tenants

        - SQSPollerPolicy:
            QueueName: !GetAtt FlosloObjectQueue.QueueName

        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0

            - Effect: Allow
              Action:
                - s3vectors:PutVectors
                - s3vectors:GetVectors
                - s3vectors:QueryVectors
                - s3vectors:DeleteVectors
              Resource: "*"

      Environment:
        Variables:
          BUCKET_NAME: floslo-us-east-1-tenants
          DYNAMO_TABLE: floslo
          VECTOR_BUCKET_NAME: floslo-us-east-1-vectors
          VECTOR_INDEX_ARN: !GetAtt FlosloVectorIndex.IndexArn
          EMBEDDING_MODEL_ID: amazon.titan-embed-text-v2:0

      Events:
        ObjectQueue:
          Type: SQS

          Properties:
            Queue: !GetAtt FlosloObjectQueue.Arn
            BatchSize: 5
            MaximumBatchingWindowInSeconds: 10

Outputs:
  ApiUrl:
    Value: !Sub https://${FlosloApi}.execute-api.${AWS::Region}.amazonaws.com